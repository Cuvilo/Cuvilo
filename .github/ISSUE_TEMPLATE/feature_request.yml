name: 功能建议 (Feature Request)
description: 提出新功能想法或使用体验改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎为 Cuvilo 提出建议！请尽量从实际面试/练习场景出发描述需求。
  - type: textarea
    id: problem
    attributes:
      label: 场景与背景
      description: 当前遇到了什么不便，或者在什么场景下需要这个功能？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 期望的解决方案
      description: 你希望 Cuvilo 如何实现或呈现这个功能？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或补充参考
      description: 是否考虑过其他解决方案？如果有其他软件的设计参考也可以提供。
